<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creatify • Login</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#f5f0e8; font-family:'Nunito',sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; }
    .card { background:#fdfaf5; border-radius:36px; padding:32px; width:400px; max-width:90%; box-shadow:0 20px 40px rgba(0,0,0,0.1); }
    h1 { font-family:'Cormorant Garamond',serif; text-align:center; margin-bottom:24px; }
    input { width:100%; padding:12px; margin-bottom:16px; border:1px solid #e2cfbb; border-radius:24px; background:#fefaf5; }
    button { background:#b89a6a; color:white; border:none; padding:12px; border-radius:40px; font-weight:bold; width:100%; cursor:pointer; }
    .message { margin-bottom:16px; padding:10px; border-radius:20px; text-align:center; display:none; }
    .error { background:#fee2e2; color:#b91c1c; display:block; }
    .success { background:#dcfce7; color:#15803d; display:block; }
    .link { text-align:center; margin-top:12px; font-size:13px; }
    .link a { color:#b89a6a; text-decoration:none; }
  </style>
</head>
<body>
<div class="card">
  <h1>✨ Creatify</h1>
  <div id="messageBox" class="message"></div>
  <input type="email" id="email" placeholder="Email" autocomplete="email">
  <input type="password" id="password" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn">Masuk</button>
  <div class="link"><a href="./register.html">Daftar akun baru</a> | <a href="./forgot-password.html">Lupa password?</a></div>
  <div class="link"><a href="./generator.html">✨ Buat undangan tanpa login</a></div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDSiWxxT-qgM_tStgaw7D8AuNaDgI3mkcY",
    authDomain: "landing-page-creatify.firebaseapp.com",
    projectId: "landing-page-creatify",
    storageBucket: "landing-page-creatify.firebasestorage.app",
    messagingSenderId: "142614580975",
    appId: "1:142614580975:web:368ba820dbfc5f69ca151a"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Jika sudah login, langsung ke dashboard
  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = "./dashboard.html";
    }
  });

  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');
  const messageBox = document.getElementById('messageBox');

  function showMessage(msg, type) {
    messageBox.textContent = msg;
    messageBox.className = `message ${type}`;
    setTimeout(() => { messageBox.className = 'message'; }, 3000);
  }

  loginBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) {
      showMessage('Email dan password harus diisi', 'error');
      return;
    }
    loginBtn.disabled = true;
    loginBtn.textContent = 'Memproses...';
    try {
      await signInWithEmailAndPassword(auth, email, password);
      // Redirect akan terjadi via onAuthStateChanged
    } catch (err) {
      let msg = 'Login gagal. Periksa email/password.';
      if (err.code === 'auth/user-not-found') msg = 'Email tidak terdaftar.';
      if (err.code === 'auth/wrong-password') msg = 'Password salah.';
      if (err.code === 'auth/too-many-requests') msg = 'Terlalu banyak percobaan, coba nanti.';
      showMessage(msg, 'error');
      loginBtn.disabled = false;
      loginBtn.textContent = 'Masuk';
    }
  });
</script>
</body>
</html>
