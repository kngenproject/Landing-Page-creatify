<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Creatify • Buat Undangan</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#f5f0e8; font-family:'Nunito',sans-serif; padding:20px; }
    .card { max-width:600px; margin:40px auto; background:#fdfaf5; border-radius:32px; padding:32px; box-shadow:0 10px 30px rgba(0,0,0,0.1); }
    h1 { font-family:'Cormorant Garamond',serif; margin-bottom:24px; text-align:center; }
    input,textarea,select { width:100%; padding:12px; margin-bottom:16px; border:1px solid #e2cfbb; border-radius:24px; background:#fefaf5; }
    button { background:#b89a6a; color:white; border:none; padding:12px; border-radius:40px; font-weight:bold; cursor:pointer; width:100%; }
    .warning { background:#fef3c7; padding:12px; border-radius:20px; margin-bottom:16px; text-align:center; display:none; }
    .preview { background:#f3ecdf; padding:20px; border-radius:24px; margin-top:20px; display:none; }
  </style>
</head>
<body>
<div class="card">
  <h1>✨ Buat Undangan Digital</h1>
  <div id="warning" class="warning"></div>
  <form id="form">
    <input type="text" id="eventName" placeholder="Nama Acara" required>
    <input type="date" id="eventDate" required>
    <input type="time" id="eventTime" required>
    <input type="text" id="eventLocation" placeholder="Lokasi" required>
    <textarea id="specialMessage" placeholder="Pesan khusus (opsional)"></textarea>
    <button type="submit">Simpan Undangan</button>
  </form>
  <div id="preview" class="preview"></div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDSiWxxT-qgM_tStgaw7D8AuNaDgI3mkcY",
    authDomain: "landing-page-creatify.firebaseapp.com",
    projectId: "landing-page-creatify",
    storageBucket: "landing-page-creatify.firebasestorage.app",
    messagingSenderId: "142614580975",
    appId: "1:142614580975:web:368ba820dbfc5f69ca151a"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  let currentUser = null;
  let authReady = false;
  const warningDiv = document.getElementById('warning');
  const form = document.getElementById('form');
  const previewDiv = document.getElementById('preview');

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    authReady = true;
    if (!user) {
      warningDiv.innerHTML = '⚠️ Anda belum login. Undangan tetap bisa dibuat, tapi tidak akan tersimpan di akun. <a href="./index.html">Login dulu</a>';
      warningDiv.style.display = 'block';
    } else {
      warningDiv.style.display = 'none';
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!authReady) {
      alert('Masih memuat, tunggu sebentar...');
      return;
    }

    const invitation = {
      id: Date.now(),
      eventName: document.getElementById('eventName').value,
      eventDate: document.getElementById('eventDate').value,
      eventTime: document.getElementById('eventTime').value,
      eventLocation: document.getElementById('eventLocation').value,
      specialMessage: document.getElementById('specialMessage').value,
      createdAt: new Date().toISOString()
    };

    if (currentUser) {
      // Simpan ke localStorage user
      const key = `creatifyInvitations_${currentUser.uid}`;
      const existing = localStorage.getItem(key);
      const list = existing ? JSON.parse(existing) : [];
      list.push(invitation);
      localStorage.setItem(key, JSON.stringify(list));
      previewDiv.innerHTML = `<p>✅ Undangan berhasil disimpan! Mengalihkan ke dashboard...</p>`;
      previewDiv.style.display = 'block';
      form.style.display = 'none';
      setTimeout(() => {
        window.location.href = "./dashboard.html";
      }, 1500);
    } else {
      // Tamu: arahkan ke login dulu
      previewDiv.innerHTML = `<p>🔐 Anda belum login. Silakan <a href="./index.html">login atau daftar</a> untuk menyimpan undangan ke akun Anda.</p>`;
      previewDiv.style.display = 'block';
      form.style.display = 'none';
    }
  });
</script>
</body>
</html>
