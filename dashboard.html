<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Creatify • Dashboard</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#f5f0e8; font-family:'Nunito',sans-serif; }
    .navbar { background:#fdfaf5; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e4d5c2; }
    .logo { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:bold; }
    .container { max-width:1000px; margin:0 auto; padding:32px 20px; }
    .welcome { margin-bottom:32px; }
    .btn { background:#b89a6a; color:white; padding:12px 24px; border:none; border-radius:40px; cursor:pointer; font-weight:bold; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; margin-top:32px; }
    .card { background:white; border-radius:24px; padding:20px; border:1px solid #e2cfbb; }
    .card h3 { margin-bottom:8px; }
    .card-meta { font-size:12px; color:#9a8570; margin:10px 0; }
    button.small { background:#f3ecdf; border:none; padding:6px 12px; border-radius:16px; margin-right:8px; cursor:pointer; }
    button.danger { background:#fee2e2; color:#b91c1c; }
    .empty { text-align:center; padding:60px; color:#9a8570; }
    .loading { text-align:center; padding:40px; }
  </style>
</head>
<body>
<div class="navbar">
  <div class="logo">✨ Creatify</div>
  <div><span id="userName"></span> <button id="logoutBtn" style="margin-left:16px; background:none; border:1px solid #b89a6a; border-radius:20px; padding:6px 12px;">Keluar</button></div>
</div>
<div class="container">
  <div class="welcome">
    <h1>Halo, <span id="userDisplay"></span>!</h1>
    <button id="createBtn" class="btn">+ Buat Undangan Baru</button>
  </div>
  <div id="invitationsArea"></div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDSiWxxT-qgM_tStgaw7D8AuNaDgI3mkcY",
    authDomain: "landing-page-creatify.firebaseapp.com",
    projectId: "landing-page-creatify",
    storageBucket: "landing-page-creatify.firebasestorage.app",
    messagingSenderId: "142614580975",
    appId: "1:142614580975:web:368ba820dbfc5f69ca151a"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  let currentUser = null;
  const createBtn = document.getElementById('createBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const invitationsArea = document.getElementById('invitationsArea');
  const userNameSpan = document.getElementById('userName');
  const userDisplaySpan = document.getElementById('userDisplay');

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "./index.html";
      return;
    }
    currentUser = user;
    const name = user.displayName || user.email.split('@')[0];
    userNameSpan.textContent = name;
    userDisplaySpan.textContent = name;
    loadInvitations();
  });

  function loadInvitations() {
    const key = `creatifyInvitations_${currentUser.uid}`;
    const data = localStorage.getItem(key);
    const invitations = data ? JSON.parse(data) : [];
    renderInvitations(invitations);
  }

  function renderInvitations(invitations) {
    if (invitations.length === 0) {
      invitationsArea.innerHTML = `<div class="empty">📭 Belum ada undangan. Klik "Buat Undangan Baru" untuk mulai.</div>`;
      return;
    }
    invitationsArea.innerHTML = `<div class="grid">` + invitations.map((inv, idx) => `
      <div class="card">
        <h3>${escapeHtml(inv.eventName)}</h3>
        <div class="card-meta">📅 ${formatDate(inv.eventDate)} | 🕒 ${inv.eventTime}</div>
        <div>📍 ${escapeHtml(inv.eventLocation)}</div>
        <div style="margin-top:12px">
          <button class="small" data-idx="${idx}" data-action="edit">Edit</button>
          <button class="small danger" data-idx="${idx}" data-action="delete">Hapus</button>
        </div>
      </div>
    `).join('') + `</div>`;

    // Event listener untuk tombol edit/hapus
    document.querySelectorAll('[data-action="edit"]').forEach(btn => {
      btn.addEventListener('click', () => alert('Fitur edit menyusul'));
    });
    document.querySelectorAll('[data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx);
        if (confirm('Hapus undangan ini?')) {
          const key = `creatifyInvitations_${currentUser.uid}`;
          const data = localStorage.getItem(key);
          let list = data ? JSON.parse(data) : [];
          list.splice(idx, 1);
          localStorage.setItem(key, JSON.stringify(list));
          loadInvitations();
        }
      });
    });
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString('id-ID');
  }
  function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&')return '&amp;';if(m==='<')return '&lt;';if(m==='>')return '&gt;';return m;}); }

  createBtn.addEventListener('click', () => {
    window.location.href = "./generator.html";
  });
  logoutBtn.addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = "./index.html";
  });
</script>
</body>
</html>
